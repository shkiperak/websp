<!DOCTYPE html>
<html lang="ru" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ГидроДел СПб | Гидроизоляция в Санкт-Петербурге</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            blue: '#0a58ca',
                            lightblue: '#38bdf8',
                            text: '#212529'
                        }
                    },
                    fontFamily: { sans: ['Montserrat', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="font-sans text-brand-text bg-white overflow-x-hidden">

    <!-- ВЫЕЗЖАЮЩЕЕ МЕНЮ (Скрыто по умолчанию) -->
    <div id="mobile-menu" class="fixed inset-0 bg-brand-lightblue z-[100] transform -translate-x-full transition-transform duration-300 ease-in-out flex flex-col">
        <div class="p-4 flex justify-start items-center">
            <button onclick="toggleMenu()" class="text-white text-4xl hover:text-gray-200">
                <i class="fa-solid fa-xmark"></i>
            </button>
        </div>
        <nav class="flex flex-col p-6 gap-6 text-white text-xl font-medium">
            <a href="#" onclick="toggleMenu()" class="hover:pl-2 transition-all">Главная</a>
            <a href="#" onclick="toggleMenu()" class="hover:pl-2 transition-all">Заказ</a>
            <a href="#" onclick="toggleMenu()" class="hover:pl-2 transition-all">Услуги</a>
            <a href="#" onclick="toggleMenu()" class="hover:pl-2 transition-all">Преимущества</a>
            <a href="#" onclick="toggleMenu()" class="hover:pl-2 transition-all">Партнеры</a>
            <a href="#" onclick="toggleMenu()" class="hover:pl-2 transition-all">Наши работы</a>
            <a href="#" onclick="toggleMenu()" class="hover:pl-2 transition-all">Отзывы</a>
            <a href="#" onclick="toggleMenu()" class="hover:pl-2 transition-all">Заказ звонка</a>
            <a href="#" onclick="toggleMenu()" class="hover:pl-2 transition-all">Инъекция</a>
        </nav>
    </div>

    <!-- ШАПКА (Как на скриншоте) -->
    <header class="bg-white border-b border-gray-200 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 h-20 flex justify-between items-center">
            
            <!-- Бургер (Слева) -->
            <button onclick="toggleMenu()" class="text-3xl text-brand-lightblue focus:outline-none">
                <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Логотип (По центру/слева) -->
            <div class="flex items-center gap-2">
                <img src="https://gidrodel.online/wp-content/uploads/2020/09/logo_gidrodel1.png" alt="ГидроДел" class="h-10">
            </div>

            <!-- Телефон (Справа) -->
            <div class="flex items-center gap-2 text-brand-blue font-bold text-sm md:text-xl">
                <i class="fa-solid fa-phone text-xs md:text-base"></i>
                <a href="tel:+78120000000">+7 (812) 000-00-00</a>
            </div>
        </div>
    </header>

    <!-- ПЕРВЫЙ ЭКРАН СО СЛАЙДЕРОМ -->
    <section id="hero" class="relative h-[500px] md:h-[600px] bg-gray-900 overflow-hidden">
        
        <!-- Картинки (Слайды) -->
        <div class="absolute inset-0 w-full h-full">
            <!-- Слайд 1 -->
            <img id="slide-img" src="https://images.unsplash.com/photo-1541888946425-d81bb19240f5?q=80&w=2070&auto=format&fit=crop" class="absolute inset-0 w-full h-full object-cover opacity-70 transition-opacity duration-500">
        </div>

        <!-- Текст поверх картинки -->
        <div class="relative z-10 max-w-7xl mx-auto px-6 h-full flex flex-col justify-center">
            <h1 class="text-white text-4xl md:text-6xl font-extrabold max-w-3xl leading-tight">
                Борьба с водой – не ваша забота, сухой подвал – наша работа!
            </h1>
        </div>

        <!-- Точки (Индикаторы слайдера) -->
        <div class="absolute bottom-6 left-0 right-0 z-10 flex justify-center gap-3">
            <button onclick="setSlide(0)" class="w-3 h-3 rounded-full bg-brand-lightblue border border-white"></button>
            <button onclick="setSlide(1)" class="w-3 h-3 rounded-full bg-white/50 border border-white hover:bg-white"></button>
            <button onclick="setSlide(2)" class="w-3 h-3 rounded-full bg-white/50 border border-white hover:bg-white"></button>
            <button onclick="setSlide(3)" class="w-3 h-3 rounded-full bg-white/50 border border-white hover:bg-white"></button>
            <button onclick="setSlide(4)" class="w-3 h-3 rounded-full bg-white/50 border border-white hover:bg-white"></button>
        </div>
    </section>

    <!-- Подключаем скрипты -->
    <script src="script.js"></script>
</body>
</html>
